<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile · TutorAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  /* Reuse the same token system as dashboard */
  :root {
    --bg: oklch(0.985 0.008 75);
    --bg-warm: oklch(0.975 0.012 75);
    --surface: #ffffff;
    --surface-sunk: oklch(0.97 0.012 75);
    --ink: oklch(0.22 0.025 280);
    --ink-2: oklch(0.40 0.025 280);
    --ink-3: oklch(0.58 0.020 280);
    --ink-4: oklch(0.75 0.015 280);
    --line: oklch(0.92 0.012 75);
    --line-2: oklch(0.95 0.010 75);
    --primary: #6c4cc9;
    --primary-2: oklch(0.55 0.16 285);
    --primary-soft: oklch(0.95 0.03 285);
    --amber: #d49a3e;
    --amber-soft: oklch(0.95 0.05 70);
    --amber-ink: oklch(0.45 0.13 60);
    --mint: #65a98b;
    --mint-soft: oklch(0.94 0.04 165);
    --critical: oklch(0.56 0.16 25);
    --critical-soft: oklch(0.95 0.04 25);

    --serif: 'Instrument Serif', 'Cambria', Georgia, serif;
    --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }

  html, body {
    margin: 0; padding: 0;
    background: #f0eee9;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .dash-root {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
    width: 100%;
  }
  .dash-root *, .dash-root *::before, .dash-root *::after { box-sizing: border-box; }

  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
  .mono  { font-family: var(--mono); font-feature-settings: "tnum" 1; }
  .num   { font-variant-numeric: tabular-nums; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500; letter-spacing: 0.01em;
    border: 1px solid transparent;
    line-height: 1;
  }
  .pill-amber { background: var(--amber-soft); color: var(--amber-ink); }
  .pill-mint  { background: var(--mint-soft); color: oklch(0.40 0.10 165); }
  .pill-critical { background: var(--critical-soft); color: var(--critical); }
  .pill-ghost { background: transparent; color: var(--ink-3); border-color: var(--line); }
  .pill-primary { background: var(--primary-soft); color: var(--primary); }

  .card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--line);
  }
  .card-warm { background: var(--bg-warm); border-radius: 16px; border: 1px solid var(--line); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    border-radius: 10px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 13px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .08s, background .15s, box-shadow .15s;
    padding: 10px 16px;
    line-height: 1;
    white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 0 oklch(0.32 0.16 285); }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(1px); box-shadow: none; }
  .btn-amber { background: var(--amber); color: #fff; box-shadow: 0 2px 0 oklch(0.52 0.13 60); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { background: var(--surface-sunk); }
  .btn-danger {
    background: transparent; color: var(--critical);
    border: 1px solid color-mix(in oklab, var(--critical) 30%, var(--line));
  }
  .btn-danger:hover { background: var(--critical-soft); }

  .navlink {
    padding: 8px 14px; border-radius: 10px; font-size: 13px; color: var(--ink-2); cursor: pointer;
    transition: background .12s, color .12s;
  }
  .navlink:hover { background: var(--surface-sunk); color: var(--ink); }
  .navlink.active { background: var(--surface); color: var(--ink); font-weight: 500; border: 1px solid var(--line); }

  .avatar {
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 600;
  }

  /* Profile-only atoms */

  /* Definition list: label/value row */
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
  .kv:last-child { border-bottom: 0; }
  .kv-label { font-size: 12.5px; color: var(--ink-3); }
  .kv-value { font-size: 13.5px; color: var(--ink); }
  .kv-empty { color: var(--ink-4); font-style: italic; font-size: 12.5px; }

  /* Soft inline tag (e.g. subjects, badges) */
  .tag-subject {
    display: inline-flex; align-items: center;
    padding: 3px 9px; border-radius: 999px;
    background: var(--primary-soft); color: var(--primary);
    font-size: 11.5px; font-weight: 500; line-height: 1.4;
  }

  /* Share icon button */
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-2); cursor: pointer; padding: 0;
    transition: background .12s, border-color .12s, color .12s;
  }
  .icon-btn:hover { background: var(--surface-sunk); color: var(--ink); }

  /* Showcase ring for badges */
  .showcase-ring { box-shadow: 0 0 0 1px color-mix(in oklab, var(--primary) 30%, transparent), 0 0 0 4px var(--primary-soft); }

  details { position: relative; }
  summary { list-style: none; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }

  /* Small "section eyebrow" */
  .eyebrow { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="dashboard-atoms.jsx"></script>
<script type="text/babel" src="profile.jsx"></script>
</body>
</html>
