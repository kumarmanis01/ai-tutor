.ae b{font-weight:500;color:var(--color-text-primary)}

<script>
const screens=[
{id:'r',title:'Register',ann:'<b>v2 spec:</b> Age collected at registration — drives parent gate. Google OAuth + mobile OTP. Terms visible inline. Age field triggers numeric keyboard. If age &lt; 13 → parent gate fires immediately after OTP verify. Age integer only — no dateOfBirth field.',html:`
<div class="ph"><div class="sb"><span>9:41</span><span>◆◆◆</span></div><div class="tb"><div class="tt">Spinzy</div></div><div class="bd">
<div style="text-align:center;padding:14px 0 12px"><div style="width:40px;height:40px;border-radius:50%;background:#EEEDFE;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#534AB7">S</div><div class="h1">Welcome to Spinzy</div><div class="su" style="margin-top:2px">AI home tutor · CBSE Grades 6–12</div></div>
<button class="bp" style="background:#fff;color:#534AB7;border:.5px solid #534AB7">Continue with Google</button>
<div style="display:flex;align-items:center;gap:7px;margin:7px 0"><div class="dv" style="flex:1;margin:0"></div><span style="font-size:10px;color:var(--color-text-tertiary)">or</span><div class="dv" style="flex:1;margin:0"></div></div>
<input type="text" placeholder="Mobile number" style="width:100%;padding:9px 10px;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:12px;background:var(--color-background-secondary);color:var(--color-text-primary);margin-bottom:6px">
<input type="text" placeholder="Your age" style="width:100%;padding:9px 10px;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:12px;background:var(--color-background-secondary);color:var(--color-text-primary);margin-bottom:6px">
<button class="bp">Send OTP</button>
<div class="no" style="text-align:center;margin-top:5px">By continuing you agree to our Terms &amp; Privacy Policy</div>
</div></div>`},

{id:'pg',title:'Parent gate',ann:'<b>v2 spec:</b> Full-screen overlay — no close, no tap-outside dismiss. Priority over ProfileCompletionGate. On success: router.refresh() — overlay gone without reload. Gate fires ONLY for explicit age &lt; 13. <span style="color:#791F1F">Bug B1 fix: null age must NOT trigger this.</span>',html:`
<div class="ph"><div class="sb"><span>9:41</span><span>◆◆◆</span></div><div class="tb"><div class="tt">Spinzy</div></div>
<div class="oc"><div class="mc">
<div class="lb" style="margin-bottom:5px">One more step</div>
<div class="h2" style="margin-bottom:5px">Parent verification required</div>
<div class="su" style="margin-bottom:11px">Since you're under 13, a parent must approve this account.</div>
<div class="lb">Parent mobile</div>
<input type="text" placeholder="+91 98765 43210" style="width:100%;padding:8px 9px;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:11px;background:var(--color-background-secondary);color:var(--color-text-primary);margin-bottom:7px">
<button class="bp" style="margin-bottom:5px">Send OTP to parent</button>
<div class="dv"></div>
<div class="lb">6-digit code from parent</div>
<div style="display:flex;gap:4px;margin-bottom:7px">${Array(6).fill('<input type="text" maxlength="1" style="width:30px;height:34px;text-align:center;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:14px;font-weight:500;background:var(--color-background-secondary);color:var(--color-text-primary)">').join('')}</div>
<button class="bp">Verify</button>
<div style="text-align:center;font-size:10px;color:var(--color-text-tertiary);margin-top:5px">Resend in 30s · Max 3 attempts · Contact support</div>
</div></div></div>`},

{id:'ps',title:'Profile setup',ann:'<b>v2 spec:</b> Checklist progress visible throughout. Grade locked after first save — server-side strip on all future PATCH. No X/close/back. Locked core subjects pre-checked and non-deselectable. BoardSubjectConfig must be seeded or picker renders empty.',html:`
<div class="ph"><div class="sb"><span>9:41</span><span>◆◆◆</span></div><div class="tb"><div class="tt">Set up your profile</div><div style="font-size:10px;color:var(--color-text-tertiary)">2 of 4</div></div><div class="bd">
<div class="pb"><div class="pf" style="width:50%;background:#534AB7"></div></div>
<div style="font-size:9px;color:var(--color-text-tertiary);margin-bottom:10px">2 of 4 complete</div>
<div class="ck"><div class="cy">✓</div><div><div style="font-weight:500;font-size:12px">Board</div><div style="font-size:10px;color:#534AB7">CBSE</div></div></div>
<div class="ck"><div class="cy">✓</div><div><div style="font-weight:500;font-size:12px">Class</div><div style="font-size:10px;color:#534AB7">Grade 10</div></div></div>
<div class="ck"><div class="cn"></div><div style="font-size:12px;color:var(--color-text-secondary)">Medium of instruction</div></div>
<div class="ck" style="border-bottom:none"><div class="cn"></div><div style="font-size:12px;color:var(--color-text-secondary)">Subjects (up to 6)</div></div>
<div class="dv"></div>
<div class="lb">Medium of instruction</div>
<div style="display:flex;gap:6px;margin-bottom:12px">
<div style="flex:1;padding:8px;text-align:center;border:2px solid #534AB7;border-radius:var(--border-radius-md);font-size:12px;font-weight:500;background:#EEEDFE;color:#3C3489;cursor:pointer">English</div>
<div style="flex:1;padding:8px;text-align:center;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;color:var(--color-text-secondary)">Hindi</div>
</div>
<div class="lb">Subjects</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px">
<div style="padding:8px;border:2px solid #534AB7;border-radius:var(--border-radius-md);font-size:11px;background:#EEEDFE;color:#3C3489;cursor:pointer">✓ Mathematics</div>
<div style="padding:8px;border:2px solid #534AB7;border-radius:var(--border-radius-md);font-size:11px;background:#EEEDFE;color:#3C3489;cursor:pointer">✓ Science</div>
<div style="padding:8px;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:11px;cursor:pointer;color:var(--color-text-secondary)">English</div>
<div style="padding:8px;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:11px;cursor:pointer;color:var(--color-text-secondary)">Social Science</div>
</div>
<div class="no">Maths &amp; Science are mandatory for CBSE Grade 10.</div>
<button class="bp">Continue</button>
</div></div>`},

{id:'xd',title:'Exam date',ann:'<b>v2 spec:</b> Exam date + study days/week drives LearningPlan horizon and urgency. Can be skipped — defaults to 6-month plan. Exam date enables crunch mode (auto-activates ≤14 days before exam). Live coverage estimate shown as user adjusts days/week.',html:`
<div class="ph"><div class="sb"><span>9:41</span><span>◆◆◆</span></div><div class="tb"><div class="tt">Exam &amp; study plan</div></div><div class="bd">
<div class="h1" style="margin-bottom:3px">When is your board exam?</div>
<div class="su" style="margin-bottom:12px">We'll build your weekly plan around your exam date.</div>
<div class="lb">Board exam date</div>
<input type="text" placeholder="e.g. 15 March 2027" style="width:100%;padding:9px 10px;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:12px;background:var(--color-background-secondary);color:var(--color-text-primary);margin-bottom:9px">
<div class="lb">Study days per week</div>
<div style="display:flex;gap:5px;margin-bottom:12px">
${['3','4','5','6','7'].map((d,i)=>i===2?`<div style="padding:7px 10px;border:2px solid #534AB7;border-radius:var(--border-radius-md);font-size:11px;font-weight:500;background:#EEEDFE;color:#3C3489;cursor:pointer">${d}</div>`:`<div style="padding:7px 10px;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:11px;color:var(--color-text-secondary);cursor:pointer">${d}</div>`).join('')}
</div>
<div class="cd" style="background:#EAF3DE;border-color:#C0DD97">
<div style="font-size:11px;color:#27500A;line-height:1.5">With 5 days/week and 52 weeks to exam — we'll cover all 14 Maths chapters with time for 2 revision rounds.</div>
</div>
<button class="bp">Build my learning plan</button>
<button class="bs">No upcoming exam — 6-month plan</button>
</div></div>`},

{id:'dg',title:'Diagnostic',ann:'<b>v2 spec:</b> Forward-only — no back button. Timer visible, amber at ≤2 min. "Save and continue later" persists to Redis 24h. MCQ options min 52px height. Abandoning mid-way requires confirmation sheet. No nav bar during active diagnostic.',html:`
<div class="ph"><div class="sb"><span>9:41</span><span>◆◆◆</span></div>
<div style="padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--color-border-tertiary)">
<div style="font-size:12px;font-weight:500;color:var(--color-text-primary)">Mathematics diagnostic</div>
<div style="font-size:10px;background:#FAEEDA;padding:2px 6px;border-radius:var(--border-radius-md);color:#633806">27:42</div>
</div><div class="bd">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
<div style="font-size:10px;color:var(--color-text-tertiary)">Question 8 of ~20</div><span class="bx pu">Algebra</span>
</div>
<div class="pb"><div class="pf" style="width:40%;background:#534AB7"></div></div>
<div style="height:10px"></div>
<div class="cd"><div style="font-size:12px;color:var(--color-text-primary);line-height:1.6">If 3x − 2 = 7, what is x?</div></div>
<div class="op os">A.&nbsp; x = 3</div>
<div class="op">B.&nbsp; x = 4</div>
<div class="op">C.&nbsp; x = 5</div>
<div class="op">D.&nbsp; x = 2</div>
<button class="bp" style="margin-top:3px">Next question</button>
<div style="text-align:center;margin-top:6px;font-size:11px;color:var(--color-text-tertiary);cursor:pointer">Save and continue later</div>
</div></div>`},

{id:'km',title:'Knowledge map',ann:'<b>v2 spec:</b> Visual only — no numeric score ever shown. Chapters ranked by (board weight × mastery gap). Green/amber/red. "Start here" highlights highest-priority chapter. Single CTA → dashboard. Shown once after each subject diagnostic.',html:`
<div class="ph"><div class="sb"><span>9:41</span><span>◆◆◆</span></div><div class="tb"><div class="tt">Your knowledge map</div></div><div class="bd">
<div class="su" style="margin-bottom:12px">Here's where you stand in Mathematics — no score, just your starting point.</div>
<div class="cd" style="border-left:3px solid #534AB7;border-radius:0 var(--border-radius-lg) var(--border-radius-lg) 0">
<div class="lb">Start here</div>
<div class="h2" style="margin-bottom:3px">Quadratic Equations</div>
<div class="su" style="margin-bottom:7px">Highest-priority gap · 8 marks in board exam</div>
<div style="display:flex;gap:4px"><span class="bx rd">Needs work</span><span class="bx pu">8 marks</span></div>
</div>
<div class="lb" style="margin-bottom:6px">All chapters</div>
${[['Real Numbers','6 marks','gn','Strong'],['Polynomials','5 marks','am','Partial'],['Triangles','7 marks','rd','Needs work'],['Coord. Geometry','6 marks','am','Partial'],['Probability','5 marks','gn','Strong']].map(([n,m,c,l])=>`<div class="cs" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;font-weight:500;color:var(--color-text-primary)">${n}</div><div style="font-size:9px;color:var(--color-text-tertiary)">${m}</div></div><span class="bx ${c}">${l}</span></div>`).join('')}
<div style="height:7px"></div>
<button class="bp">Start learning</button>
</div></div>`},

{id:'db',title:'Dashboard',ann:'<b>v2 spec — gaps vs current:</b> (1) Streak in topbar with fire + count. (2) XP this week widget with level progress bar — currently missing. (3) Subject readiness rings (red &lt;40, amber 40–70, green &gt;70) — currently missing. (4) Today\'s plan from LearningPlanItem not getNextAction. (5) Each widget must fail independently.',html:`
<div class="ph"><div class="sb"><span>9:41</span><span>◆◆◆</span></div>
<div class="tb">

function render(){
  const c=document.getElementById('screens');
  c.innerHTML=screens.map((s,i)=>`<div class="sw${i===0?' on':''}" id="s${i}"><div>${s.html}</div><div class="ae ${s.annClass||''}">${s.ann}</div></div>`).join('');
}

function go(i){
  document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('s'+i).classList.add('on');
  document.querySelectorAll('.tab')[i].classList.add('on');
}

render();
</script>
