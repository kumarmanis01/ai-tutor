# Helm values for staging deployment of the Alert Evaluator
# Fill secrets via your cluster secret mechanism (K8s Secret / SealedSecret / ExternalSecrets)

image:
  repository: ghcr.io/kumarmanis01/ai-tutor-evaluator
  tag: "ci-${{ GITHUB_SHA }}" # replace with a concrete tag or image digest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  # Environment variables the evaluator expects. Prefer mounting them from k8s Secrets.
  DATABASE_URL: ""         # set to your staging DB (optional, CI will use service DB)
  REDIS_URL: ""            # Upstash or other redis for dedupe/rate-limiter
  OPS_EMAIL: ""            # operational recipient for alerts
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  EVALUATOR_DRY_RUN: "0"   # staging: run with real sinks by default
  RUN_ONCE: "0"           # 0 -> run continuously; 1 -> run once and exit
  PUSHGATEWAY_URL: ""     # optional: set when Pushgateway provisioned

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

metrics:
  enabled: false
  # When you provision Pushgateway and prometheus scraping, enable metrics and set the serviceMonitor

nodeSelector: {}

tolerations: []

affinity: {}
