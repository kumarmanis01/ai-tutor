apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evaluator.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "evaluator.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "evaluator.name" . }}
    spec:
      containers:
        - name: evaluator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              value: {{ default "" .Values.env.DATABASE_URL }}
            - name: PUSHGATEWAY_URL
              value: {{ default "" .Values.env.PUSHGATEWAY_URL }}
            - name: REDIS_URL
              value: {{ default "" .Values.env.REDIS_URL }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "evaluator.fullname" . }}-metrics
spec:
  selector:
    app: {{ include "evaluator.name" . }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
  type: {{ .Values.service.type }}
