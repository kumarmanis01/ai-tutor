name: CI - Evaluator Build & Dry-run Integration

on:
  pull_request:
  push:
    branches: [ ci/evaluator-integration-scripts, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: ai_tutor_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgres://test:pass@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ai_tutor_test
        run: npx prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://test:pass@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ai_tutor_test
        run: npx prisma migrate deploy --preview-feature

      - name: Bundle evaluator (esbuild)
        run: npx esbuild scripts/runAlertEvaluator.ts --bundle --platform=node --target=node20 --outfile=build/runAlertEvaluator.js --external:@prisma/client --external:prom-client --external:ioredis --sourcemap

      - name: Run dry-run integration
        env:
          DATABASE_URL: postgres://test:pass@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ai_tutor_test
          RUN_ONCE: '1'
          EVALUATOR_DRY_RUN: '1'
        run: |
          node build/runAlertEvaluator.js
