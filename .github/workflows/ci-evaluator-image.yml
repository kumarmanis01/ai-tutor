name: CI - Build & Publish Evaluator Image

on:
  push:
    branches: [ci/evaluator-integration-scripts, master]
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        run: npm ci

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Helm lint chart
        run: helm lint deployment/helm/evaluator-chart

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build project bundle
        run: npx esbuild scripts/runAlertEvaluator.ts --bundle --platform=node --target=node20 --outfile=build/runAlertEvaluator.js --external:@prisma/client --external:prom-client --external:ioredis

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-tutor-evaluator:${{ github.sha }}
          file: Dockerfile.evaluator
          build-args: |
            NODE_ENV=production

      - name: Upload image info
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-image-info
          path: |
            build/runAlertEvaluator.js
            # store the image tag for downstream jobs
            <(echo "IMAGE=ghcr.io/${{ github.repository_owner }}/ai-tutor-evaluator:${{ github.sha }}")
