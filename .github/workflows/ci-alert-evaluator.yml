name: CI - Alert Evaluator

on:
  push:
  pull_request:

jobs:
  integration:
    name: Integration Tests (Alert Evaluator)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      # Use the service container hostname 'postgres' so Prisma picks it up inside Actions
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_tutor_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Wait for Postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for Postgres..."; sleep 1;
          done

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          echo "Applying migrations against $DATABASE_URL"
          npx prisma migrate deploy

      - name: Run evaluator integration tests
        run: npm run test:integration:evaluator
