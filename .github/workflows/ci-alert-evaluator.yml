name: CI - Alert Evaluator

on:
  push:
  pull_request:

jobs:
  integration:
    name: Integration Tests (Alert Evaluator)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      # Use the service container hostname 'postgres' so Prisma picks it up inside Actions
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_tutor_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Wait for Postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          # Wait for the Postgres service container by hostname 'postgres'
          # (Actions exposes service containers under their service name)
          until pg_isready -h postgres -p 5432 -U postgres; do
            echo "Waiting for Postgres on host 'postgres'..."; sleep 1;
          done

      - name: Debug Postgres connection (temporary)
        if: always()
        run: |
          echo "--- pg_isready verbose ---"
          pg_isready -h postgres -p 5432 -U postgres -d postgres -v || true
          echo "--- psql version ---"
          psql --version || true
          echo "--- try listing databases ---"
          PGPASSWORD=postgres psql -h postgres -U postgres -c "\l" || true
          echo "--- DNS / host resolution ---"
          if command -v getent >/dev/null 2>&1; then
            getent hosts postgres || true
          else
            nslookup postgres || true
          fi
          echo "--- docker ps (service candidates) ---"
          docker ps --filter ancestor=postgres --format '{{.ID}} {{.Image}} {{.Status}}' || true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          echo "Applying migrations against $DATABASE_URL"
          npx prisma migrate deploy

      - name: Run evaluator integration tests
        run: npm run test:integration:evaluator
