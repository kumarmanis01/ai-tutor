name: Lint & Typecheck

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run type-check
        run: npm run type-check
      - name: Run ESLint custom rule tests
        run: npm run test:eslint-rules
