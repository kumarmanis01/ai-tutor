name: PR Preflight Checks

on:
  pull_request:
    branches: [ master ]

jobs:
  preflight:
    name: Preflight (smart-quotes, lint, type-check, unit)
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Smart-quote check
        run: npm run preflight:smart-quotes

      - name: Lint
        run: npm run preflight:lint

      - name: Type-check
        run: npm run preflight:type-check

      - name: Run unit tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run preflight:unit

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
