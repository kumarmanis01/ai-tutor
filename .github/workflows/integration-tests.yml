name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [master, develop, 'feat/**']

jobs:
  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          retry() { for i in 1 2 3 4 5; do pg_isready -h localhost -p 5432 && break || sleep 2; done }
          sudo apt-get update && sudo apt-get install -y postgresql-client
          retry

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres" >> $GITHUB_ENV

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run ingest integration test
        run: npx jest --config=jest.integration.config.cjs --runInBand tests/integration/scripts/ingest-curriculum.integration.test.ts
