name: CI - Push Metrics to Staging Pushgateway

on:
  workflow_run:
    workflows: ['CI - Evaluator Build & Dry-run Integration']
    types: [completed]

jobs:
  push-metrics:
    if: ${{ github.event.workflow_run.conclusion == 'success' && secrets.STAGING_PUSHGATEWAY_URL }}
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download evaluator bundle artifact
        uses: actions/download-artifact@v4
        # allow missing artifact so we can surface a clear debug message instead
        continue-on-error: true
        with:
          name: evaluator-bundle

      - name: Install runtime deps
        run: npm ci --omit=dev

      - name: Push to staging Pushgateway
        env:
          PUSHGATEWAY_URL: ${{ secrets.STAGING_PUSHGATEWAY_URL }}
          RUN_ONCE: '1'
          EVALUATOR_DRY_RUN: '1'
        run: |
          # verify artifact and environment before running to provide clearer
          # debugging and avoid hard failures when artifact or secret missing
          echo "Listing files for debug:"; ls -la || true
          if [ -z "${PUSHGATEWAY_URL}" ]; then
            echo "PUSHGATEWAY_URL not set — skipping push to Pushgateway";
            exit 0
          fi
          if [ -f build/runAlertEvaluator.cjs ]; then
            node build/runAlertEvaluator.cjs
          elif [ -f runAlertEvaluator.js ]; then
            node runAlertEvaluator.js
          else
            echo "Evaluator bundle not found; skipping push to Pushgateway";
            exit 0
          fi
