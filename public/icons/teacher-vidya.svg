  <!-- Face features -->
  <!-- Eyes -->
  <ellipse cx="232" cy="188" rx="10" ry="12" fill="#3C3489"/>
  <ellipse cx="280" cy="188" rx="10" ry="12" fill="#3C3489"/>
  <!-- Eye shine -->
  <circle cx="237" cy="184" r="3.5" fill="white"/>
  <circle cx="285" cy="184" r="3.5" fill="white"/>
  <!-- Smile -->
  <path d="M236 216 Q256 232 276 216" stroke="#534AB7" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- Bindi -->
  <circle cx="256" cy="170" r="5" fill="#E24B4A"/>

  <!-- Graduation cap (mortar board) -->
  <polygon points="256,96 172,138 256,160 340,138" fill="#3C3489"/>
  <rect x="246" y="155" width="20" height="44" rx="3" fill="#3C3489"/>
  <rect x="168" y="134" width="176" height="12" rx="2" fill="#2A256B"/>
  <!-- Tassel -->
  <circle cx="266" cy="200" r="8" fill="#1D9E75"/>
  <line x1="266" y1="208" x2="266" y2="232" stroke="#1D9E75" stroke-width="4" stroke-linecap="round"/>

  <!-- Book in hand (bottom-left of body area) -->
  <rect x="158" y="320" width="72" height="90" rx="6" fill="#EEEDFE"/>
  <rect x="158" y="320" width="10" height="90" rx="3" fill="#3C3489"/>
  <line x1="176" y1="344" x2="218" y2="344" stroke="#534AB7" stroke-width="4" stroke-linecap="round"/>
  <line x1="176" y1="360" x2="218" y2="360" stroke="#534AB7" stroke-width="4" stroke-linecap="round"/>
  <line x1="176" y1="376" x2="202" y2="376" stroke="#534AB7" stroke-width="4" stroke-linecap="round"/>

  <!-- Sparkle (top-right) -->
  <g transform="translate(372,90)" fill="white" opacity="0.9">
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" />
  </g>
  <g transform="translate(412,56)" fill="white" opacity="0.5">
