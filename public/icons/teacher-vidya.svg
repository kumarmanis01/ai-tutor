<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background tile -->
  <rect width="512" height="512" rx="88" fill="#534AB7"/>

  <!-- Subtle inner glow ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Head -->
  <circle cx="256" cy="188" r="76" fill="white"/>

  <!-- Hair / dupatta accent -->
  <path d="M180 188 Q180 112 256 112 Q332 112 332 188" fill="#3C3489"/>

  <!-- Body / saree silhouette -->
  <path d="M138 430 L138 326 Q138 282 190 268 L256 258 L322 268 Q374 282 374 326 L374 430 Z"
