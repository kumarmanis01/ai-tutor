version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-ai_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ai-tutor-web:prod
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - HUSKY_SKIP_INSTALL=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pass}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ai_dev}
      - POSTGRES_HOST=postgres
    ports:
      - "3000:3000"
    command: sh -c "./scripts/run-migrate.sh && node ./node_modules/next/dist/bin/next build && npm run start"
    depends_on:
      - postgres
      - redis
    healthcheck:
      # Simpler local healthcheck: require successful HTTP 200 from root
      # Avoids relying on protected admin endpoints or metrics during local dev
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ai-tutor-worker:prod
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - HUSKY_SKIP_INSTALL=1
    command: sh -c "node dist/worker/entry.js"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
